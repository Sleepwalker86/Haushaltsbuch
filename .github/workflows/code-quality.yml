name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        pip install -r requirements.txt
    
    - name: Check code formatting with Black
      run: |
        black --check --diff . || (echo "❌ Code-Formatierung fehlerhaft. Führe 'black .' aus." && exit 1)
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff . || (echo "❌ Import-Sortierung fehlerhaft. Führe 'isort .' aus." && exit 1)
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=127
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Type checking with mypy
      run: |
        mypy . --ignore-missing-imports || true
      continue-on-error: true
    
    - name: Check for common Python issues
      run: |
        # Prüfe auf ungenutzte Imports
        python -m py_compile app.py
        find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" -not -path "./.git/*" -exec python -m py_compile {} \;
        echo "✅ Syntax-Prüfung erfolgreich"

name: Docker Build & Push

on:
  push:
    tags:
      - 'v*.*.*'  # z.B. v1.0.3
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (z.B. 1.0.3)'
        required: true
        type: string

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract version from tag
      id: extract_version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✅ Version: $VERSION"
    
    - name: Set version from input
      id: set_version
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
    
    - name: Set version from branch
      id: set_version_branch
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        # Extrahiere Version aus utils/version.py
        VERSION=$(grep "CURRENT_VERSION" utils/version.py | sed "s/.*=.*\"v\(.*\)\"/\1/")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✅ Version aus Code: $VERSION"
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          sleepwalker86/finanzapp:${{ steps.extract_version.outputs.version || steps.set_version.outputs.version || steps.set_version_branch.outputs.version || 'latest' }}
          sleepwalker86/finanzapp:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Image digest
      run: echo "✅ Docker Image erfolgreich gebaut und gepusht"
